<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1A1410">
    <script src="/gate.js"></script>
    <meta name="description"
        content="Casa Mika soft opening — a garden table by My Khe Beach opens soon. Reserve your seat.">
    <meta property="og:title" content="Casa Mika — Soft Opening Soon">
    <meta property="og:description"
        content="The garden table is almost ready. Soft opening at My Khe Beach, Da Nang.">
    <meta property="og:image" content="/image/image3d.jpg">
    <meta property="og:type" content="website">
    <title>Casa Mika — Soft Opening Soon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
        rel="stylesheet">
    <link rel="preload" as="image" href="/image/image3d.jpg">
    <link rel="stylesheet" href="/style.css">
</head>

<body class="ms-countdown-page">

    <div class="ms-countdown-bg" aria-hidden="true">
        <img src="/image/image3d.jpg" alt="" class="ms-countdown-image">
        <div class="ms-countdown-overlay"></div>
        <div class="ms-countdown-glow"></div>
    </div>

    <main class="ms-countdown-main">
        <a href="/soft-opening/" class="ms-countdown-logo" aria-label="Casa Mika">
            <img src="/image/logo.png" alt="Casa Mika"
                onerror="this.outerHTML='<span class=&quot;ms-countdown-logo-text&quot;>CASA MIKA</span>';">
        </a>

        <p class="ms-countdown-eyebrow">My Khe Beach · Da Nang</p>

        <h1 class="ms-countdown-title">Soft Opening<br><em>is almost here.</em></h1>

        <p class="ms-countdown-lede">Chúng tôi đang chuẩn bị thật chu đáo để mở cửa.</p>

        <div class="ms-countdown-grid" role="timer" aria-live="polite" aria-label="Countdown to soft opening">
            <div class="ms-countdown-unit">
                <span class="ms-countdown-num" id="cd-days">00</span>
                <span class="ms-countdown-label">Days</span>
            </div>
            <span class="ms-countdown-sep" aria-hidden="true">:</span>
            <div class="ms-countdown-unit">
                <span class="ms-countdown-num" id="cd-hours">00</span>
                <span class="ms-countdown-label">Hours</span>
            </div>
            <span class="ms-countdown-sep" aria-hidden="true">:</span>
            <div class="ms-countdown-unit">
                <span class="ms-countdown-num" id="cd-mins">00</span>
                <span class="ms-countdown-label">Minutes</span>
            </div>
            <span class="ms-countdown-sep" aria-hidden="true">:</span>
            <div class="ms-countdown-unit">
                <span class="ms-countdown-num" id="cd-secs">00</span>
                <span class="ms-countdown-label">Seconds</span>
            </div>
        </div>

        <p class="ms-countdown-date" id="cd-date">28 July 2026 · 6:30 · Da Nang (UTC+7)</p>

        <div class="ms-countdown-actions">
            <a href="https://zalo.me/0706024684" target="_blank" rel="noopener"
                class="ms-btn ms-btn-primary ms-btn-lg">Reserve on Zalo</a>
            <a href="tel:+84708888007" class="ms-btn ms-btn-outline ms-btn-lg">Call +84 708 888 007</a>
        </div>

        <p class="ms-countdown-address">37 Trần Bạch Đằng, Ngũ Hành Sơn, Da Nang</p>
    </main>

    <script>
    (function () {
        var OPEN = '2026-07-28T06:30:00+07:00';
        var openAt = new Date(OPEN).getTime();
        var daysEl = document.getElementById('cd-days');
        var hoursEl = document.getElementById('cd-hours');
        var minsEl = document.getElementById('cd-mins');
        var secsEl = document.getElementById('cd-secs');

        function pad(n) { return n < 10 ? '0' + n : String(n); }

        function tick() {
            var left = openAt - Date.now();
            if (left <= 0) {
                location.replace('/');
                return;
            }
            var s = Math.floor(left / 1000);
            var d = Math.floor(s / 86400); s -= d * 86400;
            var h = Math.floor(s / 3600); s -= h * 3600;
            var m = Math.floor(s / 60); s -= m * 60;
            daysEl.textContent = pad(d);
            hoursEl.textContent = pad(h);
            minsEl.textContent = pad(m);
            secsEl.textContent = pad(s);
        }

        tick();
        setInterval(tick, 1000);
    })();
    </script>
</body>

</html>
